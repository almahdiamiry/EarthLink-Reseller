proof_binding_rule:
  mandatory_rows: exactly one proof_target_id, proof_result_id, and primary_evidence_artifact_id
    per mandatory G8-ADV row
  uniqueness: proof_target_id, proof_result_id, and primary_evidence_artifact_id values
    must each be unique across mandatory rows
  evidence_requirement: every mandatory row must produce an execution result and a
    primary hashed evidence artifact recorded in the sealed certification run bundle
  evidence_identity: primary evidence must bind to the certification run, producing
    command/tool identity, and applicable artifact/test-corpus identities
  failure_mode: missing, duplicate, unmapped, stale, unhashed, or mismatched proof/evidence
    binding is blocking
