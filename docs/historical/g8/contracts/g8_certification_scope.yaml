schema_version: 1
scope_name: "g8_certification_scope"
description: "Machine-readable domain scope classification for Product, Certification, and Shared Control Inputs."

domains:
  - domain: "PRODUCT"
    description: "Product and runtime implementation files that contribute directly to the production artifact."
    change_policy: "IMMUTABLE"
    evidence_impact: "G1_G7_AND_G8"
    patterns:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "app/google-services.json"

  - domain: "PRODUCT_TEST"
    description: "Phase 1-5 product unit, integration, and regression tests."
    change_policy: "IMMUTABLE"
    evidence_impact: "G1_G7_AND_G8"
    patterns:
      - "app/src/test/java/com/example/CredentialSessionIsolationTest.kt"
      - "app/src/test/java/com/example/FinancialHistoryDeletionProtectionTest.kt"
      - "app/src/test/java/com/example/Phase1AtomicityAndLostAckTest.kt"
