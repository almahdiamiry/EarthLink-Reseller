schema_version: 1
matrix_name: "g8_certification_test_matrix"
description: "Execution matrix for G8 Certification Suites, Tiers, Selectors, and Environment Sensitivity."

certification_suites:
  - id: "FinalTestMatrixCertificationTest"
    class_name: "com.example.FinalTestMatrixCertificationTest"
    file_path: "app/src/test/java/com/example/FinalTestMatrixCertificationTest.kt"
    tier: "JVM"
    task_selector: "testDebugUnitTest --tests com.example.FinalTestMatrixCertificationTest"
    evidence_output: "app/build/test-results/testDebugUnitTest/TEST-com.example.FinalTestMatrixCertificationTest.xml"
    requirement_binding: "P6-G8-REQ-03"
    invariant_binding: "INV-16"
    environment_sensitivity: "OFFLINE_SAFE"

  - id: "ProductionCertificationPipelineTest"
    class_name: "com.example.ProductionCertificationPipelineTest"
    file_path: "app/src/test/java/com/example/ProductionCertificationPipelineTest.kt"
    tier: "JVM"
    task_selector: "testDebugUnitTest --tests com.example.ProductionCertificationPipelineTest"
    evidence_output: "app/build/test-results/testDebugUnitTest/TEST-com.example.ProductionCertificationPipelineTest.xml"
    requirement_binding: "P6-G8-REQ-04"
    invariant_binding: "INV-15"
    environment_sensitivity: "OFFLINE_SAFE"

  - id: "ProductionExecutableInvariantsTest"
    class_name: "com.example.ProductionExecutableInvariantsTest"
    file_path: "app/src/test/java/com/example/ProductionExecutableInvariantsTest.kt"
    tier: "JVM"
    task_selector: "testDebugUnitTest --tests com.example.ProductionExecutableInvariantsTest"
    evidence_output: "app/build/test-results/testDebugUnitTest/TEST-com.example.ProductionExecutableInvariantsTest.xml"
    requirement_binding: "P6-G8-REQ-03"
    invariant_binding: "INV-16"
    environment_sensitivity: "OFFLINE_SAFE"

  - id: "DeepCrossLayerInvariantsTest"
    class_name: "com.example.DeepCrossLayerInvariantsTest"
    file_path: "app/src/test/java/com/example/DeepCrossLayerInvariantsTest.kt"
    tier: "JVM"
    task_selector: "testDebugUnitTest --tests com.example.DeepCrossLayerInvariantsTest"
    evidence_output: "app/build/test-results/testDebugUnitTest/TEST-com.example.DeepCrossLayerInvariantsTest.xml"
    requirement_binding: "P6-G8-REQ-03"
    invariant_binding: "INV-16"
    environment_sensitivity: "OFFLINE_SAFE"

