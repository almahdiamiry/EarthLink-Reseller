# Earthlink Reseller App — Test Environment Matrix
# Authoritative Invariant Source: PRODUCTION_INVARIANTS.md
# Schema Version: 1.0.0

schema_version: "1.0.0"
authoritative_source: "PRODUCTION_INVARIANTS.md"
governing_plan: "docs/authority/G1-G8 Consolidated Architecture Summary.md"
phase_requirements_manifest: "contract/phase_requirements.yaml"

environments:
  JVM:
    name: "Pure JVM Unit Testing"
    runtime: "Java Virtual Machine (Local)"
    description: >
      Headless, highly deterministic unit tests executing on the standard JVM without Android OS shadows.
      Used for domain models, math/money calculations, state machines, conflict algorithms, and cursor logic.
    characteristics:
      - "Zero Android framework dependencies"
      - "Sub-second execution speed"
      - "Pure mathematical and state-machine verification"

  ROBOLECTRIC:
    name: "Robolectric Android Simulation"
    runtime: "Robolectric 4.x / Android SDK Shadow on JVM"
    description: >
      Simulated Android environment executing on the JVM with full support for Android SQLite Room databases,
      SharedPreferences, Coroutines, ViewModels, and lifecycle events without physical device hardware.
    characteristics:
      - "Full Room SQLite database in-memory execution"
      - "Multi-coroutine and concurrency simulation"
      - "Cross-layer end-to-end component integration"

  INSTRUMENTED:
    name: "Android Runtime Instrumentation"
    runtime: "Android OS Hardware / Emulated Device (androidTest)"
    description: >
      Tests executing directly on the real Android OS runtime (`app/src/androidTest/`).
      Validates physical concurrency, real multi-threaded SQLCipher locking, Android filesystem sandboxing,
      and WorkManager scheduler integration.
    characteristics:
      - "Physical Android OS concurrency and thread scheduling"
      - "Real multi-threaded file and database locking"
      - "Android WorkManager service integration"

  STRUCTURAL:
    name: "Static Analysis & Contract Verification"
    runtime: "Python 3 / Shell Scripts"
    description: >
      Static analysis scripts, forbidden pattern AST/regex linters, and invariant contract validators.
      Verifies source-level integrity, ensures forbidden anti-patterns never enter the codebase,
      and enforces schema adherence.
    characteristics:
      - "Regex and AST code scans"
      - "Contract schema validation"
      - "Cryptographic hash and manifest verification"

  HISTORICAL:
    name: "Historical Baseline & Golden Fixtures"
    runtime: "Robolectric / JVM Golden Fixture Validation"
    description: >
      Tests and fixtures that preserve immutable historical baseline records, verify uTower legacy import
      reproducibility, and validate that snapshot round-trips produce identical balance derivations.
    characteristics:
      - "Immutable golden source payload verification"
      - "Zero-drift baseline derivation tests"
      - "Legacy import backwards compatibility"

invariants_matrix:
  - id: "INV-01"
    name: "Four Distinct State Tiers"
    required_tiers:
      - "JVM"
      - "ROBOLECTRIC"
      - "STRUCTURAL"
    primary_suites:
      - "app/src/test/java/com/example/ResolveLocalVersionTest.kt"
      - "app/src/test/java/com/example/Phase2ServerConfirmedLifecycleTest.kt"
      - "app/src/test/java/com/example/Phase1FirestoreDocumentIdentityTest.kt"
      - "app/src/test/java/com/example/Phase1TwoDeviceConvergenceTest.kt"
      - "scripts/scan_forbidden_patterns.py"
    tier_rationale: >
      Validates state tier partitioning (Historical, Snapshot, Runtime, Remote) across pure JVM domain models,
      Robolectric lifecycle tests, and structural pattern scans.

  - id: "INV-02"
    name: "Historical Source Immutability"
    required_tiers:
      - "JVM"
      - "ROBOLECTRIC"
      - "INSTRUMENTED"
    primary_suites:
      - "app/src/test/java/com/example/ResolveLocalVersionTest.kt"
      - "app/src/test/java/com/example/Phase2ServerConfirmedLifecycleTest.kt"
      - "app/src/androidTest/java/com/example/RestoreImportInstrumentedTest.kt"
    tier_rationale: >
      Guarantees raw imported historical ledger and uTower records are immutable after commit across Robolectric SQLite
      and Android runtime instrumentation.

  - id: "INV-03"
    name: "Single Source of Truth"
    required_tiers:
      - "JVM"
      - "ROBOLECTRIC"
      - "STRUCTURAL"
    primary_suites:
      - "app/src/test/java/com/example/ResolveLocalVersionTest.kt"
      - "app/src/test/java/com/example/Phase2ServerConfirmedLifecycleTest.kt"
      - "scripts/scan_forbidden_patterns.py"
    tier_rationale: >
      Enforces Room database as single source of truth for UI state, preventing bypass writes.

  - id: "INV-04"
    name: "Historical + Snapshot Balance Identity"
    required_tiers:
      - "JVM"
      - "ROBOLECTRIC"
    primary_suites:
      - "app/src/test/java/com/example/ResolveLocalVersionTest.kt"
      - "app/src/test/java/com/example/Phase2ServerConfirmedLifecycleTest.kt"
    tier_rationale: >
      Validates that current balance is strictly equal to baseline snapshot plus runtime ledger deltas.

  - id: "INV-05"
    name: "Outbox Queue as Exclusive Sync Producer"
    required_tiers:
      - "JVM"
      - "ROBOLECTRIC"
      - "STRUCTURAL"
    primary_suites:
      - "app/src/test/java/com/example/Phase2ServerConfirmedLifecycleTest.kt"
      - "app/src/test/java/com/example/Phase2RemoteVersionAdversarialTest.kt"
      - "scripts/scan_forbidden_patterns.py"
    tier_rationale: >
      Guarantees every remote write originates from an Outbox entry and respects strict outbox state transitions.

  - id: "INV-06"
    name: "Remote Version Monotonicity"
    required_tiers:
      - "JVM"
      - "ROBOLECTRIC"
      - "STRUCTURAL"
    primary_suites:
      - "app/src/test/java/com/example/ResolveLocalVersionTest.kt"
      - "app/src/test/java/com/example/Phase2ServerConfirmedLifecycleTest.kt"
      - "app/src/test/java/com/example/Phase2RemoteVersionAdversarialTest.kt"
      - "app/src/test/java/com/example/Phase1TwoDeviceConvergenceTest.kt"
      - "scripts/scan_forbidden_patterns.py"
    tier_rationale: >
      Enforces server-assigned remote_version monotonicity and forbids local timestamp promotion.

  - id: "INV-07"
    name: "Cursor Monotonicity and Lossless Sync"
    required_tiers:
      - "ROBOLECTRIC"
    primary_suites:
      - "app/src/test/java/com/example/Phase2ServerConfirmedLifecycleTest.kt"
    tier_rationale: >
      Guarantees pull cursors advance monotonically without skipping remote events or losing state.

  - id: "INV-08"
    name: "Realtime Event Mirror Parity"
    required_tiers:
      - "ROBOLECTRIC"
      - "STRUCTURAL"
    primary_suites:
      - "app/src/test/java/com/example/Phase2ServerConfirmedLifecycleTest.kt"
      - "app/src/test/java/com/example/Phase2RemoteVersionAdversarialTest.kt"
    tier_rationale: >
      Guarantees realtime snapshots produce identical state transitions to catch-up pull sync.

  - id: "INV-09"
    name: "Tombstone Monotonicity & Deletion Integrity"
    required_tiers:
      - "ROBOLECTRIC"
    primary_suites:
      - "app/src/test/java/com/example/Phase2ServerConfirmedLifecycleTest.kt"
    tier_rationale: >
      Guarantees deletions create authoritative tombstones and propagate across devices without state revive loops.

  - id: "INV-10"
    name: "Multi-Node Convergence Identity"
    required_tiers:
      - "ROBOLECTRIC"
    primary_suites:
      - "app/src/test/java/com/example/Phase2ServerConfirmedLifecycleTest.kt"
      - "app/src/test/java/com/example/Phase2RemoteVersionAdversarialTest.kt"
    tier_rationale: >
      Guarantees all nodes applying the same set of remote events converge to identical balances.

  - id: "INV-11"
    name: "Single Active Sync Coordinator"
    required_tiers:
      - "ROBOLECTRIC"
      - "INSTRUMENTED"
    primary_suites:
      - "app/src/test/java/com/example/Phase2ServerConfirmedLifecycleTest.kt"
      - "app/src/test/java/com/example/Phase1G1PendingOperationDurabilityTest.kt"
      - "app/src/test/java/com/example/Phase1AtomicityAndLostAckTest.kt"
      - "app/src/test/java/com/example/Phase1DuplicateInitiationProtectionTest.kt"
      - "app/src/test/java/com/example/Phase1TwoDeviceConvergenceTest.kt"
      - "app/src/androidTest/java/com/example/CoordinatorInstrumentedTest.kt"
    tier_rationale: >
      Ensures exclusive coordinator execution with mutex ownership locks across JVM and Android instrumentation.

  - id: "INV-12"
    name: "Non-Mutative Audit Logging"
    required_tiers:
      - "ROBOLECTRIC"
      - "STRUCTURAL"
    primary_suites:
      - "app/src/test/java/com/example/Phase2ServerConfirmedLifecycleTest.kt"
      - "scripts/scan_forbidden_patterns.py"
    tier_rationale: >
      Guarantees audit log creation never mutates business domain state or triggers sync loops.

  - id: "INV-13"
    name: "Atomic Restore, State Isolation & Outbox Durability"
    required_tiers:
      - "ROBOLECTRIC"
      - "INSTRUMENTED"
      - "STRUCTURAL"
    primary_suites:
      - "app/src/test/java/com/example/Phase1OutboxDurabilityTest.kt"
      - "app/src/test/java/com/example/Phase1ItemIsolationTest.kt"
      - "app/src/test/java/com/example/Phase1OrphanHandlingTest.kt"
      - "app/src/test/java/com/example/Phase1FirestoreDocumentIdentityTest.kt"
      - "app/src/test/java/com/example/Phase1RestoreTransportReconstructionTest.kt"
      - "app/src/test/java/com/example/Phase1AtomicityAndLostAckTest.kt"
      - "app/src/test/java/com/example/Phase1TwoDeviceConvergenceTest.kt"
      - "app/src/androidTest/java/com/example/RestoreImportInstrumentedTest.kt"
      - "scripts/scan_forbidden_patterns.py"
    tier_rationale: >
      Guarantees backup restore is atomic, wipes existing runtime state, and resets sync cursors safely.
      Guarantees outbox obligations remain permanently durable and retryable without terminal dead_letter states.

  - id: "INV-14"
    name: "Fail-Closed Encryption & Key Recovery"
    required_tiers:
      - "ROBOLECTRIC"
      - "STRUCTURAL"
    primary_suites:
      - "app/src/test/java/com/example/Phase2ServerConfirmedLifecycleTest.kt"
      - "scripts/scan_forbidden_patterns.py"
    tier_rationale: >
      Guarantees database fails closed when encryption key recovery is unviable.

  - id: "INV-15"
    name: "Immutable Golden Fixture Verification"
    required_tiers:
      - "JVM"
      - "STRUCTURAL"
    primary_suites:
      - "app/src/test/java/com/example/ResolveLocalVersionTest.kt"
      - "scripts/verify_invariant_contract.py"
    tier_rationale: >
      Ensures golden fixture definitions match expected schema and cryptographic hashes.

  - id: "INV-16"
    name: "Deterministic Test Environment Matrix"
    required_tiers:
      - "STRUCTURAL"
    primary_suites:
      - "scripts/verify_test_environment_matrix.py"
    tier_rationale: >
      Verifies test environment matrix contract adherence and prevents silent coverage removal.

