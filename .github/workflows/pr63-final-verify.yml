name: PR63 final verification

on:
  push:
    branches:
      - fix/identity-aware-account-resolution

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/identity-aware-account-resolution
          fetch-depth: 0

      - name: Focused PR63 identity regression suite
        timeout-minutes: 20
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests "com.example.ui.viewmodels.EarthlinkSearchViewModelSeamTest" \
            --tests "com.example.N2AccountResolutionTest" \
            --tests "com.example.Workstream6LocalAccountProvenanceGuardTest" \
            --tests "com.example.Phase1DuplicateInitiationProtectionTest" \
            -x processDebugGoogleServices \
            --no-daemon \
            --console=plain

      - name: Verify PR63 test result XMLs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          root = Path("app/build/test-results/testDebugUnitTest")
          files = sorted(root.glob("TEST-*.xml"))
          if not files:
              print("No focused test result XML files found.", file=sys.stderr)
              sys.exit(1)

          total = failures = errors = skipped = 0
          for path in files:
              suite = ET.parse(path).getroot()
              total += int(suite.attrib.get("tests", "0"))
              failures += int(suite.attrib.get("failures", "0"))
              errors += int(suite.attrib.get("errors", "0"))
              skipped += int(suite.attrib.get("skipped", "0"))

          print(f"TESTS={total} FAILURES={failures} ERRORS={errors} SKIPPED={skipped}")
          if failures or errors:
              sys.exit(1)
          PY

      - name: Forbidden pattern scan
        run: |
          set -euo pipefail
          python3 scripts/scan_forbidden_patterns.py

      - name: Production compile
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin \
            -x processDebugGoogleServices \
            --no-daemon \
            --console=plain

      - name: Full production gate
        timeout-minutes: 30
        run: |
          set -euo pipefail
          chmod +x ./scripts/production_gate.sh
          ./scripts/production_gate.sh

      - name: Remove temporary verifier
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr63-final-verify.yml
          git commit -m "test(pr63): remove temporary final verifier"
          git push origin HEAD:fix/identity-aware-account-resolution
