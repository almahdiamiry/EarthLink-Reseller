name: PR63 final verification

on:
  push:
    branches:
      - fix/identity-aware-account-resolution

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/identity-aware-account-resolution
          fetch-depth: 0

      - name: Diagnose PR63 regression discovery
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew compileDebugUnitTestKotlin -x processDebugGoogleServices --no-daemon --console=plain
          echo "=== Matching compiled classes ==="
          find app/build -type f | grep -E 'IdentityAwareAccountResolutionRegressionTest|IdentityAwareAccount' || true
          echo "=== Matching source ==="
          find app/src/test -type f -name '*IdentityAwareAccountResolutionRegressionTest*' -print
          echo "=== Test implementation markers ==="
          grep -nE 'class IdentityAwareAccountResolutionRegressionTest|@Test|@RunWith|@Config' app/src/test/java/com/example/IdentityAwareAccountResolutionRegressionTest.kt
          echo "=== Test classpath entries ==="
          find app/build/classes -type f -name '*.class' | grep -E 'IdentityAware|EarthlinkSearchViewModelSeamTest' || true
      - name: Forbidden pattern scan
        run: |
          set -euo pipefail
          python3 scripts/scan_forbidden_patterns.py

      - name: Compile
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin -x processDebugGoogleServices

      - name: Remove temporary verifier
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr63-final-verify.yml
          git commit -m "test(pr63): remove temporary final verifier"
          git push origin HEAD:fix/identity-aware-account-resolution