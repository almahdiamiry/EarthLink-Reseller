name: PR63 final verification

on:
  push:
    branches:
      - fix/identity-aware-account-resolution

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/identity-aware-account-resolution
          fetch-depth: 0

      - name: Focused PR63 identity regression suite
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest             --tests "com.example.ui.viewmodels.EarthlinkSearchViewModelSeamTest"             --tests "com.example.N2AccountResolutionTest"             --tests "com.example.Workstream6LocalAccountProvenanceGuardTest"             --tests "com.example.Phase1DuplicateInitiationProtectionTest"             -x processDebugGoogleServices             --no-daemon             --console=plain

      - name: Verify PR63 test result XMLs
        run: |
          set -euo pipefail
          TEST_RESULTS_DIR="app/build/test-results/testDebugUnitTest"
          test -d "$TEST_RESULTS_DIR"
          FAILURES=$(grep -h "failures=\"[1-9]" "$TEST_RESULTS_DIR"/*.xml 2>/dev/null | wc -l || true)
          ERRORS=$(grep -h "errors=\"[1-9]" "$TEST_RESULTS_DIR"/*.xml 2>/dev/null | wc -l || true)
          echo "FAILURES=$FAILURES ERRORS=$ERRORS"
          test "$FAILURES" -eq 0
          test "$ERRORS" -eq 0

      - name: Forbidden pattern scan
        run: |
          set -euo pipefail
          python3 scripts/scan_forbidden_patterns.py

      - name: Production compile
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin             -x processDebugGoogleServices             --no-daemon             --console=plain

      - name: Full production gate
        timeout-minutes: 30
        run: |
          set -euo pipefail
          chmod +x ./scripts/production_gate.sh
          ./scripts/production_gate.sh

      - name: Remove temporary verifier
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr63-final-verify.yml
          git commit -m "test(pr63): remove temporary final verifier"
          git push origin HEAD:fix/identity-aware-account-resolution
