name: PR63 focused verification

on:
  push:
    branches:
      - fix/identity-aware-account-resolution

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/identity-aware-account-resolution
          fetch-depth: 0

      - name: Apply compatibility and compile fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/example/ui/viewmodels/EarthlinkSearchViewModel.kt')
          lines = path.read_text().splitlines()

          # Preserve exact local-account-ID lookup in loadUserDetail while using authoritative identity for username lookup.
          start = next((i for i, line in enumerate(lines) if line.strip() == 'foundLocal = withContext(Dispatchers.IO) {'), None)
          end = next((i for i in range((start or 0) + 1, len(lines)) if lines[i].strip() == 'if (identityBlocked) {'), None)
          if start is None or end is None:
              raise SystemExit(f'loadUserDetail markers not found: start={start}, end={end}')
          block = '''                    foundLocal = withContext(Dispatchers.IO) {
                        if (!knownUserId.isNullOrBlank()) {
                            val exactId = localAccountRepository.getAccountByIdOneShot(knownUserId)
                                ?.takeIf { !it.isHistoryOnlySubscriber }
                            if (exactId != null) {
                                if (userIndex > 0 && exactId.earthlinkUsername.isNullOrBlank()) {
                                    exactId
                                } else if (userIndex > 0 && exactId.ispUserIndex != null && exactId.ispUserIndex != userIndex) {
                                    identityBlocked = true
                                    null
                                } else {
                                    exactId
                                }
                            } else if (userIndex > 0) {
                                val resolution = resolveAccountFromSnapshot(
                                    localAccountRepository.getAllAccountsOneShot(),
                                    userIndex,
                                    knownUserId
                                )
                                if (resolution.status == AccountResolutionStatus.CONFLICT ||
                                    resolution.status == AccountResolutionStatus.AMBIGUOUS) {
                                    identityBlocked = true
                                }
                                resolution.account
                            } else {
                                localAccountRepository.findActiveAccountByUsernameOrIdOneShot(knownUserId)
                            }
                        } else {
                            // Target lookup via search instead of full table scan
                            localAccountRepository.searchAccounts("", limit = 200, offset = 0).find {
                                (it.earthlinkUsername != null && it.earthlinkUsername.hashCode() == userIndex) ||
                                (it.id.hashCode() == userIndex)
                            }
                        }
                    }'''.splitlines()
          lines[start:end] = block

          # Fix the refill resolution switch: switch on enum status, not the resolution data class.
          text = '\n'.join(lines) + '\n'
          old = '''                    when (val resolution = resolveAccountFromSnapshot(
                        localAccountRepository.getAllAccountsOneShot(),
                        selectedIndex,
                        userId
                    )) {
                        AccountResolutionStatus.UNIQUE -> resolution.account!!'''
          new = '''                    val resolution = resolveAccountFromSnapshot(
                        localAccountRepository.getAllAccountsOneShot(),
                        selectedIndex,
                        userId
                    )
                    when (resolution.status) {
                        AccountResolutionStatus.UNIQUE -> resolution.account!!'''
          if text.count(old) != 1:
              raise SystemExit(f'refill resolution block not found exactly once: {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Compile and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest -x processDebugGoogleServices \
            --tests com.example.IdentityAwareAccountResolutionRegressionTest \
            --tests com.example.Phase1DuplicateInitiationProtectionTest \
            --tests com.example.N2AccountResolutionTest \
            --tests com.example.Workstream6LocalAccountProvenanceGuardTest
          python3 scripts/scan_forbidden_patterns.py
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin -x processDebugGoogleServices

      - name: Commit corrected source and remove temporary verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr63-verify.yml
          git add app/src/main/java/com/example/ui/viewmodels/EarthlinkSearchViewModel.kt
          git commit -m "fix(identity): preserve exact local account lookup and compile correctness"
          git push origin HEAD:fix/identity-aware-account-resolution
